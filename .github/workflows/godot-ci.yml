name: Godot CI/CD Pipeline

# prod  -> itch.io
# app, demo, playtest -> Steam (separate App IDs via GitHub Environments)
# workflow_dispatch -> manual run; optional steam_target for Steam retry
on:
  push:
    branches:
      - prod
      - app
      - demo
      - playtest
  workflow_dispatch:
    inputs:
      steam_target:
        description: Steam deploy target (manual retry; leave none for branch-based deploy)
        required: false
        default: none
        type: choice
        options:
          - none
          - app
          - demo
          - playtest

env:
  # Read from GitHub repo variable (Settings -> Variables -> Actions).
  GODOT_VERSION: ${{ vars.GODOT_VERSION }}
  GODOT_STATUS: "stable"

jobs:
  # Job 1: import all assets and cache the results.
  import-assets:
    runs-on: ubuntu-latest
    container: barichello/godot-ci:${{ vars.GODOT_VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache import assets
        uses: actions/cache@v3
        with:
          path: .godot/imported/
          key: import-assets-${{ runner.os }}-${{ github.sha }}

      - name: Import assets
        run: godot --headless --verbose --editor --quit

  # Job 2: export all platforms as archives.
  export-game:
    runs-on: ubuntu-latest
    needs: import-assets
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v3
        with:
          path: .godot/imported/
          key: import-assets-${{ runner.os }}-${{ github.sha }}

      - name: Generate version.txt
        run: |
          git rev-list --count HEAD > version.txt
          echo "BUILD $(cat version.txt)"

      # Wine is required for Windows export on Linux runner.
      - name: Install wine
        run: |
          sudo apt install wine64
          echo "WINE_PATH=$(which wine64)" >> $GITHUB_ENV

      - name: Export Game using Godot
        uses: firebelley/godot-export@v5.2.1
        with:
          godot_executable_download_url: "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_linux.x86_64.zip"
          godot_export_templates_download_url: "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}/Godot_v${{ env.GODOT_VERSION }}-${{ env.GODOT_STATUS }}_export_templates.tpz"
          relative_project_path: "."
          archive_output: true
          cache: false
          wine_path: ${{ env.WINE_PATH }}

      - name: Upload HTML5
        uses: actions/upload-artifact@v4
        with:
          name: HTML5
          path: /home/runner/.local/share/godot/archives/HTML5.zip

      - name: Upload Linux
        uses: actions/upload-artifact@v4
        with:
          name: LinuxX11
          path: /home/runner/.local/share/godot/archives/LinuxX11.zip

      - name: Upload Windows
        uses: actions/upload-artifact@v4
        with:
          name: Windows
          path: /home/runner/.local/share/godot/archives/Windows.zip

      - name: Upload macOS
        uses: actions/upload-artifact@v4
        with:
          name: macOS
          path: /home/runner/.local/share/godot/archives/macOS.zip

  # Jobs 3-6: deploy each platform artifact to itch.io (prod branch only).
  deploy-to-itchio-linux:
    runs-on: ubuntu-latest
    needs: export-game
    if: github.ref == 'refs/heads/prod'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LinuxX11
      - name: Deploy to Itch.io (Linux)
        uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: linux
          ITCH_GAME: ${{ secrets.ITCHIO_GAME }}
          ITCH_USER: ${{ secrets.ITCHIO_USERNAME }}
          PACKAGE: LinuxX11.zip

  deploy-to-itchio-windows:
    runs-on: ubuntu-latest
    needs: export-game
    if: github.ref == 'refs/heads/prod'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Windows
      - name: Deploy to Itch.io (Windows)
        uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: windows
          ITCH_GAME: ${{ secrets.ITCHIO_GAME }}
          ITCH_USER: ${{ secrets.ITCHIO_USERNAME }}
          PACKAGE: Windows.zip

  deploy-to-itchio-mac:
    runs-on: ubuntu-latest
    needs: export-game
    if: github.ref == 'refs/heads/prod'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: macOS
      - name: Deploy to Itch.io (macOS)
        uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          CHANNEL: mac
          ITCH_GAME: ${{ secrets.ITCHIO_GAME }}
          ITCH_USER: ${{ secrets.ITCHIO_USERNAME }}
          PACKAGE: macOS.zip

  deploy-to-itchio-web:
    runs-on: ubuntu-latest
    needs: export-game
    if: github.ref == 'refs/heads/prod'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: HTML5
      - name: Deploy to Itch.io (HTML5)
        uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_API_KEY }}
          # Must be html5, not web.
          CHANNEL: html5
          ITCH_GAME: ${{ secrets.ITCHIO_GAME }}
          ITCH_USER: ${{ secrets.ITCHIO_USERNAME }}
          PACKAGE: HTML5.zip

  # Job 7: deploy Windows + Linux to Steam (app / demo / playtest branches).
  deploy-to-steam:
    runs-on: ubuntu-latest
    needs: export-game
    if: |
      contains(fromJSON('["app","demo","playtest"]'), github.ref_name) ||
      (github.event_name == 'workflow_dispatch' && inputs.steam_target != 'none')
    environment: steam-${{ github.event_name == 'workflow_dispatch' && inputs.steam_target != 'none' && inputs.steam_target || github.ref_name }}
    env:
      STEAM_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.steam_target != 'none' && inputs.steam_target || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Windows

      - uses: actions/download-artifact@v4
        with:
          name: LinuxX11

      - name: Prepare Steam content
        run: bash .github/scripts/prepare-steam-content.sh

      - name: Validate depot IDs
        run: |
          expected_linux=$((STEAM_DEPOT_WINDOWS + 1))
          if [ "${STEAM_DEPOT_LINUX}" != "${expected_linux}" ]; then
            echo "STEAM_DEPOT_LINUX (${STEAM_DEPOT_LINUX}) must equal STEAM_DEPOT_WINDOWS (${STEAM_DEPOT_WINDOWS}) + 1 for game-ci/steam-deploy" >&2
            exit 1
          fi
        env:
          STEAM_DEPOT_WINDOWS: ${{ secrets.STEAM_DEPOT_WINDOWS }}
          STEAM_DEPOT_LINUX: ${{ secrets.STEAM_DEPOT_LINUX }}

      - name: Deploy to Steam
        uses: game-ci/steam-deploy@v3
        with:
          username: ${{ secrets.STEAM_USERNAME }}
          configVdf: ${{ secrets.STEAM_CONFIG_VDF }}
          appId: ${{ secrets.STEAM_APP_ID }}
          buildDescription: "${{ env.STEAM_TARGET }} build ${{ github.sha }}"
          rootPath: steam-content
          firstDepotIdOverride: ${{ secrets.STEAM_DEPOT_WINDOWS }}
          depot1Path: windows
          depot2Path: linux
          releaseBranch: ${{ secrets.STEAM_RELEASE_BRANCH }}
